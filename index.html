<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hush Coffee Shop Assistant</title>
<style>
  :root{
    --ink: #23302E;
    --ink-soft: #43524F;
    --slate: #6E7C79;
    --line: #DCE3E0;
    --surface: #FFFFFF;
    --bg: #F1F0EA;
    --sage: #819A9F;
    --sage-deep: #5E7377;
    --warm: #B9723F;
    --warm-soft: #F3E3D3;
    --radius: 10px;
    --serif: "Iowan Old Style", "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
  }

  body{
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    height: 100vh;
  }

  header{
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }

  .mark{
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .crest{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--sage-deep);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 14px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }

  h1{
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 600;
    margin: 0;
    line-height: 1.2;
  }

  .tagline{
    font-size: 13px;
    color: var(--slate);
    margin-top: 2px;
    letter-spacing: 0.3px;
  }

  .disclaimer{
    margin-top: 14px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    background: var(--warm-soft);
    border: 1px solid #E5CBAE;
    border-radius: var(--radius);
    padding: 10px 12px;
  }

  .disclaimer b{ color: var(--ink); }

  #status{
    font-size: 12.5px;
    color: var(--slate);
    padding: 8px 20px 0;
  }

  main{
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .row{ display: flex; }
  .row.user{ justify-content: flex-end; }
  .row.bot{ justify-content: flex-start; }

  .bubble{
    max-width: 88%;
    padding: 12px 14px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.55;
  }

  .row.user .bubble{
    background: var(--sage-deep);
    color: #fff;
    border-bottom-right-radius: 3px;
  }

  .row.bot .bubble{
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    border-bottom-left-radius: 3px;
  }

  .bubble p{ margin: 0 0 8px; }
  .bubble p:last-child{ margin-bottom: 0; }

  .source{
    display: block;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 13px;
  }

  .source:first-of-type{ margin-top: 12px; }

  .source .src-title{
    font-weight: 600;
    color: var(--ink);
  }

  .source .src-snippet{
    color: var(--ink-soft);
    margin-top: 3px;
  }

  .source a{
    color: var(--warm);
    text-decoration: none;
    font-size: 12.5px;
    display: inline-block;
    margin-top: 4px;
  }

  .source a:hover{ text-decoration: underline; }

  .chips{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 20px 14px;
  }

  .chip{
    font-size: 12.5px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
  }

  .chip:hover{ border-color: var(--warm); color: var(--ink); }

  form{
    display: flex;
    gap: 10px;
    padding: 14px 20px 20px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }

  input[type="text"]{
    flex: 1;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    font-size: 14.5px;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
  }

  input[type="text"]:focus{
    outline: 2px solid var(--warm);
    outline-offset: 1px;
  }

  button{
    padding: 0 20px;
    border-radius: var(--radius);
    border: none;
    background: var(--sage-deep);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--sans);
  }

  button:hover{ background: var(--ink); }
  button:focus-visible, .chip:focus-visible{ outline: 2px solid var(--warm); outline-offset: 2px; }
  button:disabled{ opacity: 0.5; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce){
    *{ scroll-behavior: auto !important; }
  }
</style>
</head>
<body>

<header>
  <div class="mark">
    <div class="crest">HC</div>
    <div>
      <h1>Hush Coffee Shop Assistant</h1>
      <div class="tagline">Still. Warm. Premium. — answers pulled from hushcoffeeshop.com</div>
    </div>
  </div>
  <div class="disclaimer">
    <b>What this is:</b> a search assistant that reads and answers from the public content of hushcoffeeshop.com — menu, hours, location, and more.
  </div>
</header>

<div id="status">Loading site content…</div>

<main id="chat"></main>

<div class="chips" id="chips"></div>

<form id="composer">
  <input type="text" id="input" placeholder="Ask about the menu, hours, location…" autocomplete="off" disabled>
  <button type="submit" id="send" disabled>Send</button>
</form>

<script>
(function(){
  const chatEl = document.getElementById('chat');
  const statusEl = document.getElementById('status');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const chipsEl = document.getElementById('chips');

  // --- DeepSeek API config -------------------------------------------
  // WARNING: this key is embedded in client-side code and is visible to
  // anyone who views the page source / repo. Anyone could copy it and
  // use it on your DeepSeek account. Only use this setup for a low-risk
  // demo, never for anything you care about protecting.
  const DEEPSEEK_API_KEY = "sk-7cc01f63294e4574acaabfbbdc6b663d";
  const DEEPSEEK_URL = "https://api.deepseek.com/chat/completions";
  const DEEPSEEK_MODEL = "deepseek-chat";

  const STOPWORDS = new Set(("the a an and or of to in on for with is are was were be been "
    + "this that these those it its as at by from your you we our i he she they them "
    + "will can may about into over under more most such not no do does did has have had "
    + "what where when who why how which").split(" "));

  let knowledgeBase = [];
  let df = new Map();       // term -> number of chunks containing it
  let docTerms = [];        // per-chunk term frequency map
  let totalDocs = 0;
  let menuItems = [];       // parsed {name, price, url, title} from the KB

  function tokenize(text){
    return (text.toLowerCase().match(/[a-z0-9]+/g) || [])
      .filter(t => t.length > 1 && !STOPWORDS.has(t));
  }

  function buildIndex(chunks){
    totalDocs = chunks.length;
    chunks.forEach(chunk => {
      const tokens = tokenize(chunk.text + " " + chunk.title);
      const tf = new Map();
      tokens.forEach(t => tf.set(t, (tf.get(t) || 0) + 1));
      docTerms.push(tf);
      new Set(tokens).forEach(t => df.set(t, (df.get(t) || 0) + 1));
    });
  }

  function idf(term){
    const n = df.get(term) || 0;
    if (n === 0) return 0;
    return Math.log((totalDocs + 1) / n) + 1;
  }

  function search(query, topK = 3){
    const qTokens = tokenize(query);
    if (qTokens.length === 0) return [];
    const scores = knowledgeBase.map((chunk, i) => {
      const tf = docTerms[i];
      let score = 0;
      qTokens.forEach(t => {
        const f = tf.get(t) || 0;
        if (f > 0) score += f * idf(t);
      });
      return { chunk, score };
    });
    scores.sort((a, b) => b.score - a.score);
    return scores.filter(s => s.score > 0.15).slice(0, topK);
  }

  function totalKbChars(){
    return knowledgeBase.reduce((sum, c) => sum + (c.text || '').length, 0);
  }

  // --- Fuzzy matching (typo tolerance) -----------------------------------

  function levenshtein(a, b){
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    let prev = new Array(n + 1);
    let curr = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++){
      curr[0] = i;
      for (let j = 1; j <= n; j++){
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
      }
      [prev, curr] = [curr, prev];
    }
    return prev[n];
  }

  // How tolerant we are of typos scales with word length.
  function fuzzyMatch(a, b){
    if (a === b) return true;
    if (a.length < 3 || b.length < 3) return false;
    if (b.includes(a) || a.includes(b)) return true;
    const dist = levenshtein(a, b);
    const threshold = Math.max(a.length, b.length) >= 7 ? 2 : 1;
    return dist <= threshold;
  }

  // --- Menu parsing ---------------------------------------------------
  // Scraped page text is a flat line dump, e.g.:
  //   Cheese Croissant
  //   350,000 L.L.
  //   Chocolate Croissant
  //   Zaaatar Croissant
  //   250,000 L.L.
  // A price line applies to every item line since the previous price
  // (this also naturally captures "these flavors share one price" menus).

  const PRICE_LINE = /^[\d][\d,]*(?:\.\d+)?\s*(?:l\.?l\.?|lbp|\$|usd)\s*$/i;
  const MENU_START = /^(our menu|the menu|menu)$/i;
  const MENU_END = /^(moments|gallery|about|contact|the .* experience|photographs coming soon\.?)$/i;

  function parseMenuFromChunk(chunk){
    const lines = chunk.text.split('\n').map(l => l.trim()).filter(Boolean);
    let inMenu = false;
    let pending = [];
    const items = [];

    for (const line of lines){
      if (MENU_START.test(line)){ inMenu = true; continue; }
      if (inMenu && MENU_END.test(line)){ inMenu = false; continue; }
      if (!inMenu) continue;

      if (PRICE_LINE.test(line)){
        pending.forEach(name => items.push({ name, price: line, url: chunk.url, title: chunk.title }));
        pending = [];
      } else {
        pending.push(line);
      }
    }
    // leftover items with no trailing price found — still list them, price unknown
    pending.forEach(name => items.push({ name, price: null, url: chunk.url, title: chunk.title }));
    return items;
  }

  function parseMenu(chunks){
    return chunks.flatMap(parseMenuFromChunk);
  }

  // --- Small talk detection -----------------------------------------

  const GREETING_RE = /^(hi|hello|hey|hiya|yo|good morning|good afternoon|good evening|salam|hala|marhaba)[!.\s]*$/i;
  const THANKS_RE = /^(thanks|thank you|thx|ty|appreciate it)[!.\s]*$/i;
  const BYE_RE = /^(bye|goodbye|see ya|see you|later|cya)[!.\s]*$/i;
  const HOWAREYOU_RE = /how are you|how's it going|how are u/i;

  const GREETING_REPLIES = [
    "Hello! Welcome to Hush. Ask me about the menu, hours, or where to find us.",
    "Hi there! What can I help you find — menu, prices, or location?",
    "Hey! Happy to help — ask away about Hush's menu or anything else on the site."
  ];
  const THANKS_REPLIES = [
    "You're welcome! Anything else I can help with?",
    "Anytime! Let me know if you have more questions.",
    "Glad to help!"
  ];
  const BYE_REPLIES = [
    "See you soon — enjoy your visit to Hush!",
    "Bye for now! Come back anytime with questions.",
    "Take care!"
  ];

  function detectSmallTalk(query){
    const q = query.trim();
    if (GREETING_RE.test(q)) return pick(GREETING_REPLIES);
    if (THANKS_RE.test(q)) return pick(THANKS_REPLIES);
    if (BYE_RE.test(q)) return pick(BYE_REPLIES);
    if (HOWAREYOU_RE.test(q)) return "I'm doing well, thanks for asking! What can I help you find on the menu?";
    return null;
  }

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

  // --- Menu item matching ---------------------------------------------

  const MENU_LISTING_WORDS = new Set(['menu', 'items', 'offer', 'have', 'selling', 'sell', 'available', 'options', 'pastries', 'desserts', 'everything']);

  function matchMenuItems(query){
    const qTokens = tokenize(query);
    if (!qTokens.length || !menuItems.length) return [];

    const scored = menuItems.map(item => {
      const itemTokens = tokenize(item.name);
      let score = 0;
      qTokens.forEach(qt => {
        if (itemTokens.some(it => fuzzyMatch(qt, it))) score += 1;
      });
      return { item, score };
    }).filter(s => s.score > 0);

    if (!scored.length) return [];
    scored.sort((a, b) => b.score - a.score);
    const topScore = scored[0].score;
    // keep everything within 1 point of the best match, so both items in a
    // shared-price group ("chocolate croissant" + "zaatar croissant") show up
    return scored.filter(s => s.score >= topScore - 1 && s.score >= Math.min(2, topScore))
      .map(s => s.item)
      .filter((item, i, arr) => arr.findIndex(x => x.name === item.name) === i); // dedupe
  }

  function wantsFullMenuListing(query){
    const qTokens = tokenize(query);
    return qTokens.some(t => MENU_LISTING_WORDS.has(t));
  }

  function addRow(role, html){
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = html;
    row.appendChild(bubble);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  function snippetAround(text, terms, maxLen = 220){
    const lower = text.toLowerCase();
    let hitIdx = -1;
    for (const t of terms){
      const idx = lower.indexOf(t);
      if (idx !== -1 && (hitIdx === -1 || idx < hitIdx)) hitIdx = idx;
    }
    if (hitIdx === -1) return text.slice(0, maxLen) + (text.length > maxLen ? '…' : '');
    const start = Math.max(0, hitIdx - 60);
    let snip = text.slice(start, start + maxLen);
    if (start > 0) snip = '…' + snip;
    if (start + maxLen < text.length) snip = snip + '…';
    return snip;
  }

  function formatPrice(item){
    return item.price ? item.price : 'price not listed';
  }

  function menuListHtml(items, heading){
    let html = heading ? `<p>${heading}</p>` : '';
    html += '<ul>' + items.map(it =>
      `<li><b>${escapeHtml(it.name)}</b> — ${escapeHtml(formatPrice(it))}</li>`
    ).join('') + '</ul>';
    return html;
  }

  function sourceCardsFor(items){
    const seen = new Set();
    let html = '';
    items.forEach(it => {
      if (seen.has(it.url)) return;
      seen.add(it.url);
      html += `<div class="source">
        <div class="src-title">${escapeHtml(it.title || it.url)}</div>
        <a href="${it.url}" target="_blank" rel="noopener">View page →</a>
      </div>`;
    });
    return html;
  }

  function buildSystemPrompt(){
    const kbText = knowledgeBase.map(c => `--- ${c.title} (${c.url}) ---\n${c.text}`).join('\n\n');
    return `You are the Hush Coffee Shop Assistant, a friendly helper for the site hushcoffeeshop.com ("Still. Warm. Premium.").
Answer questions ONLY using the site content provided below. If the answer isn't in the content, say you don't have that
information on the site and suggest checking their Instagram @hushcoffeeshop. Keep answers short, warm, and conversational.
When listing menu items with prices, use a simple bullet list.

SITE CONTENT:
${kbText}`;
  }

  async function callDeepSeek(query){
    const res = await fetch(DEEPSEEK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${DEEPSEEK_API_KEY}`
      },
      body: JSON.stringify({
        model: DEEPSEEK_MODEL,
        messages: [
          { role: 'system', content: buildSystemPrompt() },
          { role: 'user', content: query }
        ],
        temperature: 0.4
      })
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error(`DeepSeek API error ${res.status}: ${errText}`);
    }
    const data = await res.json();
    return data.choices?.[0]?.message?.content?.trim() || "Sorry, I didn't get a response — try asking again.";
  }

  function addTypingRow(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'typing-row';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<p>…</p>';
    row.appendChild(bubble);
    chatEl.appendChild(row);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTypingRow(){
    const row = document.getElementById('typing-row');
    if (row) row.remove();
  }

  function markdownLiteToHtml(text){
    // Minimal formatting: escape, then turn "- item" lines into <li>, keep paragraphs.
    const escaped = escapeHtml(text);
    const lines = escaped.split('\n');
    let html = '';
    let inList = false;
    lines.forEach(line => {
      const trimmed = line.trim();
      if (/^[-*]\s+/.test(trimmed)) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${trimmed.replace(/^[-*]\s+/, '')}</li>`;
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        if (trimmed) html += `<p>${trimmed}</p>`;
      }
    });
    if (inList) html += '</ul>';
    return html || `<p>${escaped}</p>`;
  }

  async function answerQueryViaApi(query){
    addTypingRow();
    sendBtn.disabled = true;
    input.disabled = true;
    try {
      const reply = await callDeepSeek(query);
      removeTypingRow();
      addRow('bot', markdownLiteToHtml(reply));
    } catch (err) {
      removeTypingRow();
      addRow('bot', `<p>Sorry, I couldn't reach the assistant right now (${escapeHtml(err.message)}). Please try again in a moment.</p>`);
      console.error(err);
    } finally {
      sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  function answerQuery(query){
    // 1. Small talk — no need to touch the knowledge base at all.
    const smallTalk = detectSmallTalk(query);
    if (smallTalk){
      addRow('bot', `<p>${escapeHtml(smallTalk)}</p>`);
      return;
    }

    // 2. Specific menu item(s) — fuzzy-matched against parsed menu data.
    const itemMatches = matchMenuItems(query);
    if (itemMatches.length && !wantsFullMenuListing(query)){
      let html;
      if (itemMatches.length === 1){
        const it = itemMatches[0];
        html = `<p>The <b>${escapeHtml(it.name)}</b> is ${escapeHtml(formatPrice(it))}.</p>`;
      } else {
        html = menuListHtml(itemMatches, "Here's what I found:");
      }
      html += sourceCardsFor(itemMatches);
      addRow('bot', html);
      return;
    }

    // 3. Whole-menu style questions.
    if (wantsFullMenuListing(query) && menuItems.length){
      const html = menuListHtml(menuItems, "Here's our full menu:") + sourceCardsFor(menuItems);
      addRow('bot', html);
      return;
    }

    // 4. Fall back to general passage search (hours, location, contact, etc).
    const results = search(query);
    if (results.length === 0){
      addRow('bot', `<p>I couldn't find anything about that in hushcoffeeshop.com's public content. Try rephrasing, or check the site's Instagram <a href="https://instagram.com/hushcoffeeshop" target="_blank" rel="noopener">@hushcoffeeshop</a> directly.</p>`);
      return;
    }
    const qTokens = tokenize(query);
    let html = `<p>Here's what I found on the site:</p>`;
    results.forEach(r => {
      const snip = snippetAround(r.chunk.text, qTokens);
      html += `<div class="source">
        <div class="src-title">${escapeHtml(r.chunk.title || r.chunk.url)}</div>
        <div class="src-snippet">${escapeHtml(snip)}</div>
        <a href="${r.chunk.url}" target="_blank" rel="noopener">View page →</a>
      </div>`;
    });
    addRow('bot', html);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    addRow('user', escapeHtml(q));
    input.value = '';
    answerQueryViaApi(q);
  });

  function addChip(label){
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.textContent = label;
    chip.addEventListener('click', () => {
      input.value = label;
      form.dispatchEvent(new Event('submit'));
    });
    chipsEl.appendChild(chip);
  }

  fetch('./knowledge_base.json')
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(data => {
      knowledgeBase = data;
      buildIndex(knowledgeBase);
      menuItems = parseMenu(knowledgeBase);
      statusEl.textContent = `Ready — searching ${knowledgeBase.length} passages from hushcoffeeshop.com.`;
      input.disabled = false;
      sendBtn.disabled = false;
      addRow('bot', `<p>Hi there! I'm the Hush Coffee Shop assistant — ask me anything about the menu, hours, or where to find us.</p>`);
      ['Menu', 'Hours', 'Location', 'Contact'].forEach(addChip);
    })
    .catch(err => {
      statusEl.textContent = 'Could not load knowledge_base.json.';
      addRow('bot', `<p><b>Setup needed:</b> this page couldn't load <code>knowledge_base.json</code>. Make sure that file sits in the same folder as this page in your GitHub repo (run the Colab script to generate it first).</p>`);
      console.error(err);
    });
})();
</script>

</body>
</html>
